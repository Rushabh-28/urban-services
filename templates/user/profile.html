{% extends "../base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container-fluid py-4">
  <div class="card col-md-6">
    <div class="card-header pb-0"><h5 class="mb-0">My Profile</h5></div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
